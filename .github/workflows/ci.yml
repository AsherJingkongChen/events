name: ci

on:
  push:
  pull_request:

# Each job runs a recipe of the justfile, the same one run before a commit.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is as much a home as Linux: the kernel's lock on a folder is tested on both
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59
      - name: The pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: just test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59
      - name: The pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: just check
