name: release

# A tag v<version> releases that version: an archive for each target, attested, on the release
# page. Every push to main builds the same archives and releases nothing, so a tag is never the
# first time a target is built.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A target is here when someone runs events on it; anyone else builds with cargo install,
        # and asks for theirs in an issue.
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          # musl is linked whole into the binary, which then runs whatever libc the machine has
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: The C compiler for musl, which builds ring
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: The pinned toolchain from rust-toolchain.toml, for this target
        run: rustup toolchain install && rustup target add "${{ matrix.target }}"
      - name: The tag names the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Pack the binary
        run: |
          mkdir dist
          tar -czf "dist/events-${{ matrix.target }}.tgz" -C "target/${{ matrix.target }}/release" events
      - name: What was packed runs
        run: |
          mkdir unpacked
          tar -xzf dist/*.tgz -C unpacked
          unpacked/events --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tgz
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.server_url }}/${{ github.repository }}"
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install: ${repo}/blob/${GITHUB_REF_NAME}/README.md#install"
