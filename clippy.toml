    { path = "core::option::Option::unwrap_or", reason = "a value made up for the case hides it: match both arms and say what the case means, or hand the error on" },
    { path = "core::option::Option::unwrap_or_default", reason = "a value made up for the case hides it: match both arms and say what the case means, or hand the error on" },
