disallowed-types = [
    { path = "i128", reason = "an event holds 64-bit ints at most" },
    { path = "u128", reason = "an event holds 64-bit ints at most" },
]

# No hidden defaults and no hidden fallbacks: a value made up for a case is where a bug hides. A
# None or an Err with a true meaning is a match with both arms and a line saying what it means; one
# that cannot happen is structured away; anything else is an error, handed on. Cargo.toml forbids
# these everywhere, tests included.
